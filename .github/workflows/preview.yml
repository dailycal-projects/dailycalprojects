# Deploys each pull request as a Cloudflare Workers Preview of the `data` Worker, at
# https://pr<number>.datadev.dailycal.org, updates it on every push, and deletes it when the pull
# request is closed or merged. See "Previews" in README.md.
name: Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

# One run per pull request at a time; closing it cancels a deploy that's still running
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # to comment the preview's address

env:
  PREVIEW: pr${{ github.event.pull_request.number }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    # Pull requests from forks don't get the repository's secrets, so they aren't previewed
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Cloudflare only adds this header to workers.dev previews, not custom-domain ones
      - name: Keep the preview out of search engines
        run: |
          printf '/*\n  X-Robots-Tag: noindex\n' > dist/_headers

      - name: Deploy the preview
        run: npx wrangler preview --name "$PREVIEW" --message "${{ github.event.pull_request.head.sha }}"

      - name: Comment the preview's address
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none \
            --body "**Preview:** https://$PREVIEW.datadev.dailycal.org (updated for ${SHA:0:7}). It's deleted when this pull request is closed."

  delete:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete the preview
        run: npx --yes wrangler@4 preview delete --worker-name data --name "$PREVIEW" --skip-confirmation
